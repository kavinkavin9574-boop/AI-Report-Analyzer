services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: reports
      POSTGRES_USER: app
      POSTGRES_PASSWORD: report123
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d reports"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-change-this}@db:5432/reports
      OPENROUTER_API_KEY:
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-sonnet-4.5}
      AVAILABLE_MODELS: ${AVAILABLE_MODELS:-anthropic/claude-sonnet-4.5,anthropic/claude-3.5-haiku,openai/gpt-4o,openai/gpt-4o-mini,google/gemini-2.5-pro,google/gemini-2.5-flash,meta-llama/llama-3.3-70b-instruct,deepseek/deepseek-chat}
      FRONTEND_ORIGIN: http://localhost:5173
      UPLOAD_DIR: /app/uploads
      PROCESSED_DIR: /app/processed
    volumes:
      - uploads_data:/app/uploads
      - processed_data:/app/processed
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data:
  processed_data:
